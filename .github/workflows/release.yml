# Publishing a GitHub release (tag e.g. v0.2.0) builds module.zip and attaches it,
# together with a module.json whose version, manifest and download URLs match the tag.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Stamp version and URLs into module.json
        run: |
          VERSION="${TAG#v}"
          jq --arg version "$VERSION" \
             --arg manifest "https://github.com/$REPO/releases/latest/download/module.json" \
             --arg download "https://github.com/$REPO/releases/download/$TAG/module.zip" \
             '.version = $version | .manifest = $manifest | .download = $download' \
             module.json > module.json.tmp
          mv module.json.tmp module.json

      - name: Build module.zip
        run: zip -r module.zip module.json LICENSE README.md CHANGELOG.md scripts templates styles lang data

      - name: Attach to release
        run: gh release upload "$TAG" module.json module.zip --clobber
